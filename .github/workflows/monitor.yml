name: Monitor de Eventos - Chapela y Redondela

on:
  schedule:
    # Programador interno de GitHub (respaldo automático cada 15 min)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Permite ejecutar manualmente la comprobación en cualquier momento desde la pestaña Actions en GitHub
  repository_dispatch:
    # Permite disparar la comprobación desde un cron externo (ej. cron-job.org) con puntualidad al segundo
    types: [check-events, cron]

concurrency:
  group: monitor-scheduled-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-events:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restaurar suscriptores de la caché
        uses: actions/cache/restore@v4
        id: cache-subscribers
        with:
          path: suscriptores.json
          key: subscribers-${{ github.run_id }}
          restore-keys: |
            subscribers-

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar monitor de eventos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUBSCRIBERS_SEED: ${{ secrets.SUBSCRIBERS_SEED }}
          KEYWORDS: ${{ secrets.KEYWORDS || 'Chapela,Redondela' }}
        run: |
          python monitor.py

      - name: Guardar suscriptores en la caché
        uses: actions/cache/save@v4
        if: always()
        with:
          path: suscriptores.json
          key: subscribers-${{ github.run_id }}

      - name: Guardar estado actualizado en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estado_articulos.json
          if git diff --staged --quiet; then
            echo "No hay cambios en el registro de eventos."
          else
            git commit -m "chore: actualizar registro de eventos [skip ci]"
            git push
          fi
