name: Monitor de Artículos - Chapela y Redondela (Test Manual)

on:
  workflow_dispatch:
    # Permite ejecutar manualmente la comprobación para pruebas desde la pestaña Actions en GitHub

permissions:
  contents: read

jobs:
  check-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar monitor de noticias (Prueba aislada)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORDS: ${{ secrets.KEYWORDS || 'Chapela,Redondela' }}
        run: |
          python monitor.py
