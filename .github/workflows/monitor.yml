name: Monitor de Artículos - Chapela y Redondela

on:
  schedule:
    # Dos ejecuciones al día:
    # - Mañana (~09:25 hora peninsular española / 07:25 UTC)
    # - Tarde/Noche (~19:25 hora peninsular española / 17:25 UTC)
    # Usamos minuto :25 para evitar las colas masivas de GitHub en los minutos en punto (:00).
    - cron: '25 7 * * *'
    - cron: '25 17 * * *'
  workflow_dispatch:
    # Permite ejecutar manualmente la comprobación desde la pestaña Actions en GitHub

permissions:
  contents: write

jobs:
  check-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar monitor de noticias
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORDS: ${{ secrets.KEYWORDS || 'Chapela,Redondela' }}
        run: |
          python monitor.py

      - name: Guardar estado y suscriptores en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add estado_articulos.json suscriptores.json
          if git diff --staged --quiet; then
            echo "Sin cambios en artículos ni nuevos suscriptores. No es necesario commit."
          else
            git commit -m "chore: actualizar registro de artículos y suscriptores [skip ci]"
            git pull --rebase origin main
            git push
          fi
